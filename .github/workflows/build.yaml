name: Rebuild profile card

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"      # 04:00 UTC daily
  workflow_dispatch:          # and whenever you press the button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # today.py is standard library only, so there is nothing to install.
      - name: Redraw the cards
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::warning::ACCESS_TOKEN is not set yet - see SETUP.md step 2. Skipping the rebuild."
            exit 0
          fi
          python3 today.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "Rebuild profile card"
          git push
